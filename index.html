<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Tech - معرض الفيديوهات</title>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 1. تعريف المتغيرات للألوان */
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-bg: #1e1e1e;
        }

        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #121212;
            --card-bg: #f0f0f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Aref Ruqaa', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            transition: 0.3s;
        }

        header { text-align: center; margin-bottom: 30px; padding: 20px; }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg,#F0F8FF,#0000FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* تنسيق الأزرار */
        .social-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            color: white !important;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .subscribe-btn { background-color: #ff0000; box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4); }
        .instagram-btn { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #bc1888); box-shadow: 0 4px 15px rgba(188, 24, 136, 0.3); }
        .facebook-btn { background-color: #1877F2; box-shadow: 0 4px 15px rgba(24, 119, 242, 0.4); }
        .telegram-btn { background-color: #0088cc; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3); }

        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }

        /* زر اللايت والدارك العائم */
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #0000FF;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* تنسيق الكروت */
        .video-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .video-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        
        .video-player { width: 100%; aspect-ratio: 16/9; background: #000; }
        .video-info { padding: 15px; }
        .video-title { font-size: 1.2rem; margin-bottom: 8px; color: var(--text-color); }
        .video-description { color: #aaa; font-size: 0.95rem; }
    </style>
</head>
<body id="mainBody">

    <button class="theme-toggle" id="modeBtn">🌓</button>

    <header>
        <h1>معلومات تقنيه حصريه لجميع الاجهزه</h1>
        <p>Click on any video to play</p>
        
        <div class="social-buttons">
           <a href="https://www.youtube.com/@vo3tex-tech?sub_confirmation=1" target="_blank" class="btn subscribe-btn"> إشترك في القناة ❤️</a>
            <a href="https://www.instagram.com/vo3tex_tech" target="_blank" class="btn instagram-btn">تابعنا علي إنستجرام 📸</a>
            <a href="https://www.facebook.com/share/17V6PMbSnh/" target="_blank" class="btn facebook-btn">تابعنا علي فيسبوك🔵</a>
            <a href="https://t.me/vo3textech" target="_blank" class="btn telegram-btn">تابعنا علي تليجرام ✈️</a>
        </div>
    </header>

    <main class="video-container" id="videoContainer"></main>

    <script>
        const videos = [
            { src: "Sequence 01.mp4", title: "تهكير الويندوز", description: "شرح كامل لطرق الحماية" },
            { src: "Sequence 01_2 (1).mp4", title: "تهكير العاب وبرامج", description: "كواليس تعديل البرامج" },
            { src: "Sequence 01_1.mp4", title: "تنظيم ملفات الكمبيوتر", description: "أفضل طريقة للترتيب" }
        ];

        // إنشاء كروت الفيديوهات
        function createVideoCards() {
            const container = document.getElementById('videoContainer');
            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <video class="video-player" controls><source src="${video.src}" type="video/mp4"></video>
                    <div class="video-info">
                        <h3 class="video-title">${video.title}</h3>
                        <p class="video-description">${video.description}</p>
                    </div>`;
                container.appendChild(card);
            });
        }
        createVideoCards();

        // كود تشغيل اللايت والدارك مود
        const modeBtn = document.getElementById('modeBtn');
        const body = document.getElementById('mainBody');

        modeBtn.addEventListener('click', () => {
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                modeBtn.innerText = '🌓';
            } else {
                body.setAttribute('data-theme', 'light');
                modeBtn.innerText = '🌙';
            }
        });
    </script>
</body>
</html>
