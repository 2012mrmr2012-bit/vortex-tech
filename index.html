<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vortex Tech - معرض الفيديوهات</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="wrap">
  <header>
    <div class="logo">VORTEX TECH</div>
    <h1>معلومات تقنية حصرية لجميع الأجهزة</h1>
    <p class="sub">اضغط على أي فيديو لمشاهدته</p>
    <div class="social">
      <a class="btn yt" target="_blank" rel="noopener" href="https://www.youtube.com/@vo3tex-tech?sub_confirmation=1"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg> إشترك في القناة</a>
      <a class="btn ig" target="_blank" rel="noopener" href="https://www.instagram.com/vo3tex_tech"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg> تابعنا على إنستجرام</a>
      <a class="btn fb" target="_blank" rel="noopener" href="https://www.facebook.com/share/17V6PMbSnh/"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg> تابعنا على فيسبوك</a>
      <a class="btn tg" target="_blank" rel="noopener" href="https://t.me/vo3textech"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg> تابعنا على تليجرام</a>
    </div>
  </header>
  <div class="bar"><input class="search" id="q" placeholder="🔍 ابحث عن فيديو..."><span class="count" id="cnt"></span></div>
  <div class="chips" id="chips"></div>
  <main class="grid" id="grid"></main>
</div>
<button class="fab" id="modeBtn" title="الوضع">🌓</button>
<div class="modal" id="player"><div class="box"><button class="x" id="px">✕</button><div id="pm"></div><div class="info"><h3 id="pt"></h3><p id="pd"></p></div></div></div>
<script>
const $ = id => document.getElementById(id);
let videos = [], cat = 'all';
const GROUPS = { all: 'الكل', video: '🎬 فيديو', image: '🖼️ صور', book: '📚 كتب', post: '📝 منشورات' };
const grp = v => v.type === 'youtube' || v.type === 'file' ? 'video' : v.type === 'link' ? 'post' : v.type;
const BADGE = { video: 'فيديو', image: 'صورة', book: 'كتاب', post: 'منشور' };
const ICON = { facebook: '🔵', instagram: '📸', telegram: '✈️', t: '✈️', twitter: '🐦', x: '✖️', tiktok: '🎵', youtube: '▶️', youtu: '▶️', linkedin: '💼' };
const safe = u => /^https?:\/\//i.test(u || '');
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
const icon = u => { const p = host(u).split('.'); return ICON[p[p.length - 2]] || ICON[p[0]] || '🔗'; };
function chips() {
  const c = $('chips'); c.innerHTML = '';
  Object.keys(GROUPS).forEach(k => {
    if (k !== 'all' && !videos.some(v => grp(v) === k)) return;
    const b = document.createElement('button'); b.className = 'chip' + (cat === k ? ' on' : ''); b.textContent = GROUPS[k];
    b.onclick = () => { cat = k; chips(); render(); }; c.appendChild(b);
  });
}
function liveThumb(t, src) {
  const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true; v.playsInline = true; v.src = src; t.appendChild(v);
  v.addEventListener('loadedmetadata', () => { const d = v.duration; v.currentTime = isFinite(d) && d > 0 ? Math.min(2, Math.max(0.1, d * .1)) : 0.1; });
  v.addEventListener('seeked', () => setTimeout(() => { try { if (!v.videoWidth) return; const w = Math.min(v.videoWidth, 640), h = Math.round(v.videoHeight * w / v.videoWidth), c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(v, 0, 0, w, h); t.replaceChild(c, v); } catch (e) {} }, 150), { once: true });
}
function render() {
  const term = $('q').value.trim().toLowerCase(), g = $('grid'); g.innerHTML = '';
  const list = videos.filter(v => (cat === 'all' || grp(v) === cat) && (v.title + ' ' + (v.description || '')).toLowerCase().includes(term));
  $('cnt').textContent = videos.length + ' عنصر';
  if (!list.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = videos.length ? 'مفيش نتائج مطابقة' : 'مفيش محتوى لسه'; g.appendChild(e); return; }
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .1 });
  list.forEach((v, i) => {
    const c = document.createElement('div'); c.className = 'card'; c.style.transitionDelay = (i % 6) * 80 + 'ms';
    c.innerHTML = '<div class="thumb"><span class="badge"></span></div><div class="info"><h3></h3><p></p></div>';
    const t = c.querySelector('.thumb'); c.querySelector('.badge').textContent = BADGE[grp(v)] || '';
    const playIcon = '<div class="play"><span>▶</span></div>';
    if (v.type === 'youtube') { const im = document.createElement('img'); im.loading = 'lazy'; im.alt = ''; im.src = 'https://i.ytimg.com/vi/' + encodeURIComponent(v.yt) + '/hqdefault.jpg'; t.appendChild(im); t.insertAdjacentHTML('beforeend', playIcon); }
    else if (v.thumb && v.type !== 'image') { const im = document.createElement('img'); im.loading = 'lazy'; im.alt = ''; im.src = 'thumbs/' + encodeURIComponent(v.thumb); t.appendChild(im); if (v.type === 'file') t.insertAdjacentHTML('beforeend', playIcon); }
    else if (v.type === 'file') { liveThumb(t, 'videos/' + encodeURIComponent(v.file)); t.insertAdjacentHTML('beforeend', playIcon); }
    else if (v.type === 'image') { const im = document.createElement('img'); im.loading = 'lazy'; im.alt = v.title; im.src = 'images/' + encodeURIComponent(v.file); t.appendChild(im); }
    else if (v.type === 'book') { const d = document.createElement('div'); d.className = 'cover bk'; d.innerHTML = '📚<small>PDF</small>'; t.appendChild(d); }
    else if (v.type === 'post') { const d = document.createElement('div'); d.className = 'cover pt'; d.textContent = '📝'; t.appendChild(d); }
    else { const d = document.createElement('div'); d.className = 'cover ln'; d.innerHTML = '<span></span><small></small>'; d.firstChild.textContent = icon(v.url); d.lastChild.textContent = host(v.url); t.appendChild(d); }
    c.querySelector('h3').textContent = v.title; c.querySelector('p').textContent = v.type === 'post' ? (v.body || '').slice(0, 120) + ((v.body || '').length > 120 ? '…' : '') : (v.description || '');
    c.onclick = () => open_(v); g.appendChild(c); io.observe(c);
  });
}
function open_(v) {
  if (v.type === 'book') return void window.open('books/' + encodeURIComponent(v.file), '_blank', 'noopener');
  if (v.type === 'link') return void (safe(v.url) && window.open(v.url, '_blank', 'noopener,noreferrer'));
  openPlayer(v);
}
function openPlayer(v) {
  const m = $('pm'); m.innerHTML = '';
  if (v.type === 'youtube') { const f = document.createElement('iframe'); f.allow = 'autoplay; fullscreen; picture-in-picture'; f.allowFullscreen = true; f.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.yt) + '?autoplay=1&rel=0'; m.appendChild(f); }
  else if (v.type === 'post') { if (v.thumb) { const im = document.createElement('img'); im.className = 'full'; im.alt = ''; im.src = 'thumbs/' + encodeURIComponent(v.thumb); m.appendChild(im); } const d = document.createElement('div'); d.className = 'postbody'; d.textContent = v.body || ''; m.appendChild(d); }
  else if (v.type === 'image') { const im = document.createElement('img'); im.className = 'full'; im.alt = v.title; im.src = 'images/' + encodeURIComponent(v.file); m.appendChild(im); }
  else { const p = document.createElement('video'); p.controls = true; p.playsInline = true; p.autoplay = true; p.src = 'videos/' + encodeURIComponent(v.file); m.appendChild(p); }
  $('pt').textContent = v.title; $('pd').textContent = v.type === 'post' ? '' : (v.description || ''); $('player').classList.add('open');
}
function closePlayer() { $('pm').innerHTML = ''; $('player').classList.remove('open'); }
$('px').onclick = closePlayer;
$('player').onclick = e => { if (e.target.id === 'player') closePlayer(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });
$('q').oninput = render;
const root = document.documentElement;
try { const t = localStorage.getItem('vt-theme'); if (t) root.setAttribute('data-theme', t); } catch (e) {}
$('modeBtn').onclick = () => { const n = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; root.setAttribute('data-theme', n); try { localStorage.setItem('vt-theme', n); } catch (e) {} };
fetch('videos.json?t=' + Date.now()).then(r => r.json()).then(v => { videos = v; chips(); render(); }).catch(render);
</script>
</body>
</html>
