<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video Gallery</title>
    <style>
        /* تنسيق زر الاشتراك */
.subscribe-btn {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 25px;
    background-color: #ff0000; /* لون يوتيوب الأحمر */
    color: white !important;
    text-decoration: none;
    border-radius: 50px;
    font-weight: bold;
    font-size: 1.1rem;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
    border: none;
    cursor: pointer;
}

.subscribe-btn:hover {
    background-color: #cc0000;
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: white;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg,#F0F8FF,#0000FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .video-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .video-card {
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        
        .video-player {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }
        
        .video-info {
            padding: 15px;
        }
        
        .video-title {
            font-size: 1.2rem;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .video-description {
            color: #aaa;
            font-size: 0.95rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
   <header>
        <h1>جميع الفيديوهات المحظورة</h1>
        <p>Click on any video to play</p>
        
        <a href="https://https://youtube.com/@vo3tex-tech?si=W-7uFguimB0oK0j9?sub_confirmation=1" target="_blank" class="subscribe-btn">
             إشترك في القناة الآن ❤️
        </a>
    </header>
    <main class="video-container" id="videoContainer">
        <!-- Videos will be dynamically inserted here -->
    </main>

    <script>
        // Replace this array with your own video information
        const videos = [
            {
                src: "Sequence 01.mp4",
                title: "تهكير الويندوز",
                description: "Exploring the beautiful Rocky Mountains during summer"
            },
            {
                src: "Sequence 01_2 (1).mp4",
                title: "تهكير العاب وبرامج",
                description: "Capturing the perfect sunset at Malibu Beach"
            },
            {
                src: "Sequence 01_1.mp4",
                title: "تنظيم ملفات الكمبيوتر",
                description: "Night tour through downtown Tokyo"
            }


            // Add more videos following this format
        ];

        // Function to create video cards
        function createVideoCards() {
            const container = document.getElementById('videoContainer');
            
            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                
                card.innerHTML = `
                    <video class="video-player" controls>
                        <source src="${video.src}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <div class="video-info">
                        <h3 class="video-title">${video.title}</h3>
                        <p class="video-description">${video.description}</p>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // Initialize the app when page loads
        document.addEventListener('DOMContentLoaded', () => {
            createVideoCards();
        });
    </script>
</body>

</html>
